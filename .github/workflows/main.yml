name: Build ImmortalWrt NR3053 (Auto 25.12.x)

env:
  IMMORTALWRT_BRANCH_PREFIX: "25.12"
  KMOD_REPO_OWNER: "diepkhoa"
  KMOD_REPO_NAME: "sdmc-nr3053-kmods"
  KMOD_PAGES_BASE_URL: "https://diepkhoa.github.io/sdmc-nr3053-kmods"
  KMOD_MAX_SIZE_MB: "850"

on:
  schedule:
    # Chay tu dong hang tuan vao Thu Hai luc 02:00 UTC (09:00 gio Viet Nam)
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phien ban ImmortalWrt (vd: 25.12.2). De trong de tu tim ban 25.12.x moi nhat'
        required: false
        default: ''
        type: string
      force_rebuild:
        description: 'Ep build lai du da co Release tren repo'
        required: false
        default: false
        type: boolean
      test_keepalive:
        description: 'Test cap nhat README keepalive (nhu cron hang tuan)'
        required: false
        default: false
        type: boolean

jobs:
  check-version:
    name: Check ImmortalWrt Version
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      should_build: ${{ steps.check.outputs.should_build }}

    steps:
      - name: Determine target version and check Release status
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail

          CLEAN_INPUT=$(printf '%s' "${INPUT_VERSION}" | tr -d '[:space:]' | sed 's/^v//')

          if [ -n "${CLEAN_INPUT}" ]; then
            VERSION="${CLEAN_INPUT}"
            TAG="v${VERSION}"
            echo "Using manually specified version: ${VERSION} (${TAG})"
          else
            REMOTE_TAGS=$(git ls-remote --tags --refs https://github.com/immortalwrt/immortalwrt.git "v${IMMORTALWRT_BRANCH_PREFIX}.*")
            LATEST_TAG=$(printf '%s\n' "${REMOTE_TAGS}" \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E "^v${IMMORTALWRT_BRANCH_PREFIX//./\\.}\.[0-9]+$" \
              | sort -V \
              | tail -n 1 || true)

            if [ -z "${LATEST_TAG}" ]; then
              echo "::error::Khong tim thay tag on dinh nao khop voi v${IMMORTALWRT_BRANCH_PREFIX}.x"
              exit 1
            fi

            TAG="${LATEST_TAG}"
            VERSION="${TAG#v}"
            echo "Latest stable upstream tag: ${TAG} (version ${VERSION})"
          fi

          RELEASE_EXISTS="false"
          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi

          SHOULD_BUILD="false"
          if [ "${RELEASE_EXISTS}" = "false" ] || [ "${FORCE_REBUILD}" = "true" ] || [ -n "${CLEAN_INPUT}" ]; then
            SHOULD_BUILD="true"
          fi

          echo "Summary: version=${VERSION}, tag=${TAG}, release_exists=${RELEASE_EXISTS}, force_rebuild=${FORCE_REBUILD}, should_build=${SHOULD_BUILD}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_build=${SHOULD_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for weekly keepalive
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.test_keepalive == true)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README timestamp (weekly cron keepalive)
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.test_keepalive == true)
        env:
          TARGET_VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          NOW_VN=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S (UTC+7)')
          export STATUS_LINE="*Kiểm tra cập nhật tự động gần nhất: ${NOW_VN} — ImmortalWrt ${TARGET_VERSION}*"

          python3 -c '
          import os, pathlib
          p = pathlib.Path("README.md")
          lines = p.read_text(encoding="utf-8").splitlines()
          status = os.environ["STATUS_LINE"]
          if lines and lines[-1].startswith("*Kiểm tra cập nhật tự động gần nhất:"):
              lines[-1] = status
          else:
              lines.extend(["", "---", "", status])
          p.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: weekly update check (${TARGET_VERSION}) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  build:
    name: Build Firmware (${{ needs.check-version.outputs.version }})
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      IM_VERSION: ${{ needs.check-version.outputs.version }}
      IM_TAG: ${{ needs.check-version.outputs.tag }}

    steps:
      - name: 1. Tai nguyen lieu (DTS, Config)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 2. Giai phong dung luong va Cai dat cong cu
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time ccache

      - name: 3. Tai ma nguon ImmortalWrt Stable ${{ env.IM_VERSION }}
        run: |
          set -euo pipefail
          git clone --depth 1 -b "${IM_TAG}" https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. Khoi tao Bo nho dem CCache
        uses: actions/cache@v5.1.0
        with:
          path: |
            immortalwrt/.ccache
            immortalwrt/dl
            immortalwrt/staging_dir/host
            immortalwrt/staging_dir/toolchain-*
          key: ccache-immortalwrt-${{ env.IM_VERSION }}-${{ github.run_number }}
          restore-keys: |
            ccache-immortalwrt-${{ env.IM_VERSION }}-
            ccache-immortalwrt-${{ env.IMMORTALWRT_BRANCH_PREFIX }}.
            ccache-immortalwrt-

      - name: 5. Cau hinh phan cung, 02_network va Hybrid Repo
        run: |
          set -euo pipefail

          # Copy file DTS
          mkdir -p immortalwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/
          cp mt7981b-sdmc-nr3053.dts immortalwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/

          # Chen cau hinh thiet bi vao filogic.mk
          cat << 'EOF' >> immortalwrt/target/linux/mediatek/image/filogic.mk
          define Device/sdmc_nr3053
            DEVICE_VENDOR := SDMC
            DEVICE_MODEL := NR3053
            DEVICE_DTS := mt7981b-sdmc-nr3053
            DEVICE_DTS_DIR := ../files-6.12/arch/arm64/boot/dts/mediatek
            SUPPORTED_DEVICES := viettel,nr3053 sdmc,nr3053
            UBINIZE_OPTS := -E 5
            BLOCKSIZE := 128k
            PAGESIZE := 2048
            IMAGE_SIZE := 245760k
            IMAGES += factory.bin
            IMAGE/factory.bin := append-ubi | check-size
            IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
            DEVICE_PACKAGES := kmod-mt7981-firmware mt7981-wo-firmware
          endef
          TARGET_DEVICES += sdmc_nr3053
          EOF

          # Khai bao dung 3 cong LAN + 1 cong WAN vao 02_network (tranh roi vao nhanh mac dinh 4 LAN)
          sed -i '/mediatek_setup_interfaces()/,/^}/ s/\(case .*board.* in\)/\1\n\tviettel,nr3053|sdmc,nr3053)\n\t\tucidef_set_interfaces_lan_wan "lan1 lan2 lan3" wan\n\t\t;;/' immortalwrt/target/linux/mediatek/filogic/base-files/etc/board.d/02_network
          grep -A 4 "viettel,nr3053" immortalwrt/target/linux/mediatek/filogic/base-files/etc/board.d/02_network

          # DUNG KICH BAN FIRST-BOOT DE EP HE THONG NHAN REPO CHUAN (dong bo IM_VERSION va KMOD_PAGES_BASE_URL)
          mkdir -p immortalwrt/files/etc/uci-defaults
          cat << EOF > immortalwrt/files/etc/uci-defaults/zz-custom-repos
          #!/bin/sh
          # Xoa bo cac file backup rac do he thong tu tao ra
          rm -f /etc/apk/repositories.d/*.bak

          # Ghi de vinh vien danh sach kho chuan (Hybrid Repo)
          cat << 'REPO_EOF' > /etc/apk/repositories.d/distfeeds.list
          ${KMOD_PAGES_BASE_URL}/releases/${IM_VERSION}/targets/mediatek/filogic/packages/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/targets/mediatek/filogic/packages/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/packages/aarch64_cortex-a53/base/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/packages/aarch64_cortex-a53/luci/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/packages/aarch64_cortex-a53/packages/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/packages/aarch64_cortex-a53/routing/packages.adb
          https://downloads.immortalwrt.org/releases/${IM_VERSION}/packages/aarch64_cortex-a53/telephony/packages.adb
          REPO_EOF

          uci delete system.ntp.server
          uci add_list system.ntp.server='162.159.200.1'
          uci add_list system.ntp.server='216.239.35.0'
          uci add_list system.ntp.server='0.openwrt.pool.ntp.org'
          uci commit system

          # TOI UU HOA TOC DO GIAO DIEN WEB LUCI
          uci set uhttpd.main.max_requests='100'
          uci set uhttpd.main.tcp_keepalive='1'
          uci commit uhttpd
          # Thoat de he thong tu dong xoa kich ban nay sau khi chay xong
          exit 0
          EOF
          chmod +x immortalwrt/files/etc/uci-defaults/zz-custom-repos

          echo "=== Kiem tra noi dung zz-custom-repos ==="
          cat immortalwrt/files/etc/uci-defaults/zz-custom-repos

          # Lay dong phien ban kernel 6.12 tu ma nguon ImmortalWrt
          KPATCH=$(grep '^LINUX_VERSION-6\.12' immortalwrt/target/linux/generic/kernel-6.12 | awk -F'=' '{print $2}' | tr -d '[:space:]')
          KERNEL_VER="6.12${KPATCH}"
          echo "Detected Kernel: ${KERNEL_VER}"
          echo "KERNEL_VER=${KERNEL_VER}" >> "$GITHUB_ENV"

          # TAO BANNER CHO SSH
          mkdir -p immortalwrt/files/etc
          cat << 'EOF' > immortalwrt/files/etc/banner
            __  __ _____  ___         ____  ___  _   _ 
           |  \/  | ____|/ _ \       / ___|/ _ \| \ | |
           | |\/| |  _| | | | |_____| |  _| | | |  \| |
           | |  | | |___| |_| |_____| |_| | |_| | |\  |
           |_|  |_|_____|\___/       \____|\___/|_| \_|
           --------------------------------------------------
             SDMC NR3053
          EOF
          cat << EOF >> immortalwrt/files/etc/banner
             ImmortalWrt ${IM_VERSION} Stable | Kernel ${KERNEL_VER}
             BE FREE and UNAFAIRD
           --------------------------------------------------

          EOF

      - name: 6. Bat dau Bien dich (Dung CCache)
        run: |
          cp seed.config immortalwrt/.config
          cd immortalwrt
          mkdir -p .ccache
          echo "CONFIG_CCACHE=y" >> .config
          make defconfig
          make download -j8
          make -j$(nproc)

      - name: 7a. Dang Firmware len muc Releases (chi nhanh main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.IM_VERSION }}"
          name: "Firmware NR3053 ImmortalWrt ${{ env.IM_VERSION }} - diepkhoa (build #${{ github.run_number }})"
          body: |
            ## SDMC NR3053
            - **ImmortalWrt:** `${{ env.IM_VERSION }}` (`${{ env.IM_TAG }}`)
            - **Linux Kernel:** `${{ env.KERNEL_VER }}`
            - **Kmod APK Repo:** `${{ env.KMOD_PAGES_BASE_URL }}/releases/${{ env.IM_VERSION }}/targets/mediatek/filogic/packages/packages.adb`
            - **SUPPORTED_DEVICES:** `viettel,nr3053`, `sdmc,nr3053` (3 LAN + 1 WAN)

            ### Lưu ý nâng cấp (Sysupgrade)
            - Khi nâng cấp qua LuCI từ các bản cũ, khuyến nghị giữ tương thích `SUPPORTED_DEVICES` (`viettel,nr3053` / `sdmc,nr3053`).
            - Nếu chọn **Keep settings** từ bản cũ từng bị dư `lan4` trong `/etc/config/network`, hãy vào **Network → Interfaces → Devices → `br-lan` → Configure** và bỏ chọn `lan4`.
          files: |
            immortalwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
            immortalwrt/bin/targets/mediatek/filogic/*factory.bin
            immortalwrt/bin/targets/mediatek/filogic/*initramfs-kernel.bin

      - name: 7b. Upload Firmware len Artifacts (thu nghiem nhanh phu)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nr3053-immortalwrt-${{ env.IM_VERSION }}-test
          path: |
            immortalwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
            immortalwrt/bin/targets/mediatek/filogic/*factory.bin
            immortalwrt/bin/targets/mediatek/filogic/*initramfs-kernel.bin
          retention-days: 7

      - name: 8. Kiem tra an toan kho Kmod
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -n "${IM_VERSION}" || { echo "::error::IM_VERSION is empty!"; exit 1; }
          [[ "${IM_VERSION}" != *"/"* && "${IM_VERSION}" != *".."* ]] || { echo "::error::Invalid IM_VERSION: ${IM_VERSION}"; exit 1; }
          test -f "./immortalwrt/bin/targets/mediatek/filogic/packages/packages.adb" || { echo "::error::packages.adb missing!"; exit 1; }

      - name: 9. Publish Kmod APK Repo to External GitHub Pages (Rolling Retention)
        if: github.ref == 'refs/heads/main'
        env:
          KMOD_DEPLOY_TOKEN: ${{ secrets.KMOD_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${KMOD_DEPLOY_TOKEN}" || { echo "::error::Secret KMOD_DEPLOY_TOKEN is not set!"; exit 1; }

          REPO_URL="https://github.com/${KMOD_REPO_OWNER}/${KMOD_REPO_NAME}.git"
          AUTH_B64=$(printf 'x-access-token:%s' "${KMOD_DEPLOY_TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH_B64}"
          GIT_AUTH_ARG="http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_B64}"

          KMOD_WORK_DIR="/tmp/kmod-pages"
          rm -rf "${KMOD_WORK_DIR}"
          REMOTE_GH_PAGES=$(git -C /tmp -c http.https://github.com/.extraheader= -c "${GIT_AUTH_ARG}" ls-remote --heads "${REPO_URL}" gh-pages)
          if [ -n "${REMOTE_GH_PAGES}" ]; then
            echo "Cloning existing gh-pages snapshot from ${KMOD_REPO_OWNER}/${KMOD_REPO_NAME}..."
            git -C /tmp -c http.https://github.com/.extraheader= -c "${GIT_AUTH_ARG}" clone --depth 1 --branch gh-pages "${REPO_URL}" "${KMOD_WORK_DIR}"
          else
            echo "Initializing new gh-pages branch for ${KMOD_REPO_OWNER}/${KMOD_REPO_NAME}..."
            mkdir -p "${KMOD_WORK_DIR}"
            git -C "${KMOD_WORK_DIR}" init
            git -C "${KMOD_WORK_DIR}" remote add origin "${REPO_URL}"
          fi

          TARGET_DIR="${KMOD_WORK_DIR}/releases/${IM_VERSION}/targets/mediatek/filogic/packages"
          rm -rf "${TARGET_DIR}"
          mkdir -p "${TARGET_DIR}"
          cp -a ./immortalwrt/bin/targets/mediatek/filogic/packages/. "${TARGET_DIR}/"
          touch "${KMOD_WORK_DIR}/.nojekyll"

          # Luu cuon chieu: chi xoa cac ban cu nhat neu tong dung luong vuot KMOD_MAX_SIZE_MB (mac dinh 850MB < 1GB Pages)
          cd "${KMOD_WORK_DIR}"
          TOTAL_MB=$(du -sm releases | awk '{print $1}')
          echo "Kmod repo size before pruning: ${TOTAL_MB}MB (limit: ${KMOD_MAX_SIZE_MB}MB)"

          while [ "${TOTAL_MB}" -gt "${KMOD_MAX_SIZE_MB}" ]; do
            OLDEST_VER=$(find releases -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
              | sort -V \
              | grep -vxF "${IM_VERSION}" \
              | head -n 1 || true)
            if [ -z "${OLDEST_VER}" ]; then
              echo "::warning::Cannot prune further without deleting current version ${IM_VERSION} (size=${TOTAL_MB}MB)"
              break
            fi
            echo "Pruning oldest kmod release: ${OLDEST_VER} (total ${TOTAL_MB}MB > ${KMOD_MAX_SIZE_MB}MB)"
            rm -rf "releases/${OLDEST_VER}"
            TOTAL_MB=$(du -sm releases | awk '{print $1}')
          done

          echo "=== Retained kmod releases (total: ${TOTAL_MB}MB / ${KMOD_MAX_SIZE_MB}MB) ==="
          du -sh releases/* releases

          # Dong goi 1 orphan snapshot commit duy nhat de chong phinh lich su .git nhung van giu nguyen cac ban trong releases/
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages-snapshot
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -A
          git commit -m "Deploy kmod repo for ImmortalWrt v${IM_VERSION} (${TOTAL_MB}MB/${KMOD_MAX_SIZE_MB}MB)"
          git branch -M gh-pages-snapshot gh-pages
          git -c http.https://github.com/.extraheader= -c "${GIT_AUTH_ARG}" push --force origin gh-pages
