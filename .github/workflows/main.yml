name: Build ImmortalWrt NR3053

# Chi chay khi bam nut "Run workflow" thu cong
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Tai nguyen lieu (DTS, Config) tu kho cua ban
      uses: actions/checkout@v4

    - name: 2. Cai dat cac cong cu bien dich
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time

    - name: 3. Tai ma nguon ImmortalWrt 25.12
      run: |
        git clone -b openwrt-25.12 https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 4. Chuan bi cau hinh phan cung va Lai tao Kho APK
      run: |
        # Dua file DTS cua ban vao thu muc
        cp mt7981b-sdmc-nr3053.dts openwrt/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/
        
        # Chen cau hinh thiet bi vao filogic.mk
        cat << 'EOF' >> openwrt/target/linux/mediatek/image/filogic.mk
        define Device/sdmc_nr3053
          DEVICE_VENDOR := SDMC
          DEVICE_MODEL := NR3053 - DiepKhoa Edition
          DEVICE_DTS := mt7981b-sdmc-nr3053
          DEVICE_DTS_DIR := ../files-6.12/arch/arm64/boot/dts/mediatek
          SUPPORTED_DEVICES := sdmc,nr3053
          UBINIZE_OPTS := -E 5
          BLOCKSIZE := 128k
          PAGESIZE := 2048
          IMAGE_SIZE := 245760k
          IMAGES += factory.bin
          IMAGE/factory.bin := append-ubi | check-size
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          DEVICE_PACKAGES := kmod-mt7981-firmware mt7981-wo-firmware
        endef
        TARGET_DEVICES += sdmc_nr3053
        EOF

        # Nhuung file cau hinh APK Lai tao vao thang ban ROM
        mkdir -p openwrt/files/etc/apk
        cat << 'EOF' > openwrt/files/etc/apk/repositories
        https://diepkhoa.github.io/sdmc-nr3053-repo/targets/mediatek/filogic/packages/packages.adb
        https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/base/packages.adb
        https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/luci/packages.adb
        https://mirrors.vsean.net/openwrt/releases/25.12-SNAPSHOT/packages/aarch64_cortex-a53/packages/packages.adb
        EOF

    - name: 5. Bat dau Bien dich (Ton khoang 2 tieng)
      run: |
        cp seed.config openwrt/.config
        cd openwrt
        make defconfig
        make download -j8
        make -j$(nproc)

    - name: 6. Dang Firmware len muc Releases cua GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v25.12.${{ github.run_number }}"
        name: "Firmware NR3053 Auto-Build #${{ github.run_number }}"
        files: |
          openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
          openwrt/bin/targets/mediatek/filogic/*initramfs-kernel.bin

    - name: 7. Tao file .nojekyll de sua loi 404 cho GitHub Pages
      run: |
        touch openwrt/bin/.nojekyll

    - name: 8. Tu dong xuat ban Kho ung dung sang nhanh gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./openwrt/bin
        publish_branch: gh-pages
        keep_files: false
