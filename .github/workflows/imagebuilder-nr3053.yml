name: Build NR3053 ImageBuilder

on:
  workflow_dispatch:

env:
  IB_VERSION: "25.12.1"

jobs:
  build:
    name: Build Firmware voi ImageBuilder
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Tai nguyen lieu (DTS) tu kho cua ban
      uses: actions/checkout@v4

    - name: 2. Cai dat cong cu giai nen Sieu toc (zstd va python3)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd python3

    - name: 3. Tai bo hinh anh ImageBuilder Chinh hang tu ImmortalWrt
      run: |
        IB_URL="https://downloads.immortalwrt.org/releases/${{ env.IB_VERSION }}/targets/mediatek/filogic/immortalwrt-imagebuilder-${{ env.IB_VERSION }}-mediatek-filogic.Linux-x86_64.tar.zst"
        wget -q $IB_URL -O imagebuilder.tar.zst || wget -q "https://downloads.immortalwrt.org/releases/${{ env.IB_VERSION }}/targets/mediatek/filogic/immortalwrt-imagebuilder-${{ env.IB_VERSION }}-mediatek-filogic.Linux-x86_64.tar.xz" -O imagebuilder.tar.zst
        
        mkdir -p ib
        tar -xaf imagebuilder.tar.zst -C ib --strip-components=1

    - name: 4. Bom DTS va Muon xac Profile jcg_q30-pro
      run: |
        # Copy DTS cua NR3053 vao ImageBuilder
        mkdir -p ib/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/
        cp mt7981b-sdmc-nr3053.dts ib/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/

        # Dung Python de ghi de ruot cua Profile jcg_q30-pro thanh NR3053 (256MB ROM)
        python3 -c "
        import re
        with open('ib/target/linux/mediatek/image/filogic.mk', 'r') as f:
            content = f.read()

        new_device = '''define Device/jcg_q30-pro
          DEVICE_VENDOR := SDMC
          DEVICE_MODEL := NR3053 - DiepKhoa ImageBuilder
          DEVICE_DTS := mt7981b-sdmc-nr3053
          DEVICE_DTS_DIR := ../files-6.12/arch/arm64/boot/dts/mediatek
          SUPPORTED_DEVICES := sdmc,nr3053 jcg,q30-pro
          UBINIZE_OPTS := -E 5
          BLOCKSIZE := 128k
          PAGESIZE := 2048
          IMAGE_SIZE := 245760k
          IMAGES += factory.bin
          IMAGE/factory.bin := append-ubi | check-size
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          DEVICE_PACKAGES := kmod-mt7981-firmware mt7981-wo-firmware
        endef'''

        content = re.sub(r'define Device/jcg_q30-pro.*?endef', new_device, content, flags=re.DOTALL)

        with open('ib/target/linux/mediatek/image/filogic.mk', 'w') as f:
            f.write(content)
        "

    - name: 5. Nhung SSH Banner Ca Nhan (DiepKhoa Edition)
      run: |
        mkdir -p custom_files/etc
        cat << 'EOF' > custom_files/etc/banner
        =================================================
            SDMC NR3053 - DIEPKHOA IMAGEBUILDER EDITION
            ImmortalWrt 25.12.1 Stable | Kernel 6.12
            A U Ok?
        =================================================
        EOF

    - name: 6. Lap ghep ROM Sieu Toc (Chi ton 1-2 phut)
      run: |
        cd ib
        make image PROFILE="jcg_q30-pro" \
                   PACKAGES="luci-app-dockerman luci-app-adguardhome luci-proto-wireguard luci-app-tailscale-community luci-app-sqm luci-app-filemanager" \
                   FILES="../custom_files"

    - name: 6.5. Doi ten file ROM cho dep
      run: |
        cd ib/bin/targets/mediatek/filogic/
        for f in *jcg_q30-pro*; do
          [ -e "$f" ] && mv "$f" "${f//jcg_q30-pro/sdmc_nr3053}"
        done

    - name: 7. Dang Firmware len muc Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "ib-v25.12.1-b${{ github.run_number }}"
        name: "Firmware ImageBuilder NR3053 #${{ github.run_number }}"
        files: |
          ib/bin/targets/mediatek/filogic/*sysupgrade.bin
          ib/bin/targets/mediatek/filogic/*initramfs-kernel.bin
