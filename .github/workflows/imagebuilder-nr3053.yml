name: Build NR3053 ImageBuilder (Sieu Toc 2 Phut)

on:
  workflow_dispatch:

env:
  IB_VERSION: "25.12.1"

jobs:
  build:
    name: Build Firmware voi ImageBuilder
    runs-on: ubuntu-22.04

    steps:
    - name: 1. Tai nguyen lieu (DTS) tu kho cua ban
      uses: actions/checkout@v4

    - name: 2. Cai dat cong cu giai nen Sieu toc (zstd)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd

    - name: 3. Tai bo hinh anh ImageBuilder Chinh hang tu ImmortalWrt
      run: |
        # Tai file ImageBuilder pre-compiled tu may chu chinh thuc
        IB_URL="https://downloads.immortalwrt.org/releases/${{ env.IB_VERSION }}/targets/mediatek/filogic/immortalwrt-imagebuilder-${{ env.IB_VERSION }}-mediatek-filogic.Linux-x86_64.tar.zst"
        wget -q $IB_URL -O imagebuilder.tar.zst || wget -q "https://downloads.immortalwrt.org/releases/${{ env.IB_VERSION }}/targets/mediatek/filogic/immortalwrt-imagebuilder-${{ env.IB_VERSION }}-mediatek-filogic.Linux-x86_64.tar.xz" -O imagebuilder.tar.zst
        
        mkdir -p ib
        tar -xaf imagebuilder.tar.zst -C ib --strip-components=1

    - name: 4. Bơm DTS va Dinh nghia thiet bi NR3053
      run: |
        # Dua file DTS cua ban vao ImageBuilder
        mkdir -p ib/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/
        cp mt7981b-sdmc-nr3053.dts ib/target/linux/mediatek/files-6.12/arch/arm64/boot/dts/mediatek/

        # Chen Profile NR3053 vao filogic.mk cua ImageBuilder
        cat << 'EOF' >> ib/target/linux/mediatek/image/filogic.mk
        define Device/sdmc_nr3053
          DEVICE_VENDOR := SDMC
          DEVICE_MODEL := NR3053 - DiepKhoa ImageBuilder
          DEVICE_DTS := mt7981b-sdmc-nr3053
          DEVICE_DTS_DIR := ../files-6.12/arch/arm64/boot/dts/mediatek
          SUPPORTED_DEVICES := sdmc,nr3053
          UBINIZE_OPTS := -E 5
          BLOCKSIZE := 128k
          PAGESIZE := 2048
          IMAGE_SIZE := 245760k
          IMAGES += factory.bin
          IMAGE/factory.bin := append-ubi | check-size
          IMAGE/sysupgrade.bin := sysupgrade-tar | append-metadata
          DEVICE_PACKAGES := kmod-mt7981-firmware mt7981-wo-firmware
        endef
        TARGET_DEVICES += sdmc_nr3053
        EOF

    - name: 5. Nhung SSH Banner
      run: |
        mkdir -p custom_files/etc
        cat << 'EOF' > custom_files/etc/banner
        =================================================
            SDMC NR3053 - DIEPKHOA EDITION
            ImmortalWrt 25.12.1 Stable | Kernel 6.12
            A U OK?
        =================================================
        EOF

    - name: 6. Lap ghep ROM Sieu Toc (KHONG BIEN DICH C)
      run: |
        cd ib
        # Liet ke cac app ban muon cai san vao ROM o muc PACKAGES
        make image PROFILE="sdmc_nr3053" \
                   PACKAGES="luci-app-adguardhome luci-proto-wireguard luci-app-tailscale-community luci-app-sqm luci-app-adguardhome" \
                   FILES="../custom_files"

    - name: 7. Dang Firmware len muc Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "ib-v25.12.1-b${{ github.run_number }}"
        name: "Firmware ImageBuilder NR3053 #${{ github.run_number }}"
        files: |
          ib/bin/targets/mediatek/filogic/*sysupgrade.bin
          ib/bin/targets/mediatek/filogic/*initramfs-kernel.bin
